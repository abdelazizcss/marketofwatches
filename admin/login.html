<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
    <body class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <div class="logo-icon">⌚</div>
                    </div>
                    <h1>بوخاري للساعات</h1>
                    <p>لوحة التحكم</p>
                </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        required
                        placeholder="admin@example.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        required
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>

                <div id="login-error" class="login-error" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    <span>تسجيل الدخول</span>
                </button>
            </form>

            <div class="login-footer">
                <a href="../index.html">العودة إلى الموقع</a>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <div id="modal-container"></div>

    <script type="module">
        import { login, checkAuth } from './js/auth.js';
        import { showToast } from './js/ui.js';
        import { getCsrfToken, setupNavigationGuard, setupSensitiveFormProtection, rateLimiter } from './js/protection.js';

        setupNavigationGuard(['/login.html']);

        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');

        setupSensitiveFormProtection(loginForm);

        async function init() {
            const csrfToken = getCsrfToken();
            if (!csrfToken) {
                window.location.href = 'login.html';
                return;
            }

            const isAuth = await checkAuth();
            if (isAuth) {
                window.location.href = 'index.html';
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            rateLimiter('login_attempt', 5, 60000);

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-small"></span> جاري التحميل...';
            loginError.style.display = 'none';

            try {
                await login(email, password);
                showToast('تم تسجيل الدخول بنجاح', 'success');
                window.location.href = 'index.html';
            } catch (error) {
                loginError.textContent = error.message || 'حدث خطأ في تسجيل الدخول';
                loginError.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>تسجيل الدخول</span>';
            }
        });

        init();
    </script>
</body>
</html>
